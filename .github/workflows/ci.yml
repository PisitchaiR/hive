name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

# Cancel in-progress runs for the same branch when a newer commit lands —
# saves macOS minutes on rebase-heavy PRs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # macos-15's default Xcode (16.x) ships Swift 6.1. Package.swift pins
      # swift-tools-version 6.2, so select the latest stable Xcode on the
      # runner image — currently Xcode 26.x which ships Swift 6.2+.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      # GhosttyKit.xcframework is pinned by SHA inside setup-libghostty.sh.
      # Cache on the script contents — bumping the pin invalidates the cache.
      - name: Cache GhosttyKit.xcframework
        uses: actions/cache@v4
        with:
          path: Vendor
          key: ghostty-${{ hashFiles('scripts/setup-libghostty.sh') }}

      - name: Cache SPM build artifacts
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Fetch libghostty
        run: bash scripts/setup-libghostty.sh

      - name: Build
        run: swift build

      - name: Test
        run: swift test
